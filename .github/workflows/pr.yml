name: PR

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      E2E_TEST_MODE: 'true'
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_E2E_USER_A_EMAIL: ${{ secrets.CLERK_E2E_USER_A_EMAIL }}
      CLERK_E2E_USER_B_EMAIL: ${{ secrets.CLERK_E2E_USER_B_EMAIL }}
      NEON_E2E_BRANCH_NAME: leland-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check required E2E configuration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_E2E_PARENT_BRANCH: ${{ vars.NEON_E2E_PARENT_BRANCH }}
        run: |
          missing=0
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_E2E_PARENT_BRANCH CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY CLERK_E2E_USER_A_EMAIL CLERK_E2E_USER_B_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Playwright E2E"
              missing=1
            fi
          done

          if [ -n "$CLERK_E2E_USER_A_EMAIL" ] && [ "$CLERK_E2E_USER_A_EMAIL" = "$CLERK_E2E_USER_B_EMAIL" ]; then
            echo "::error::CLERK_E2E_USER_A_EMAIL and CLERK_E2E_USER_B_EMAIL must be distinct"
            missing=1
          fi

          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Set Neon branch expiration
        id: neon-expiration
        run: echo "expires_at=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon E2E branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_E2E_BRANCH_NAME }}
          parent_branch: ${{ vars.NEON_E2E_PARENT_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
          prisma: true
          expires_at: ${{ steps.neon-expiration.outputs.expires_at }}

      - name: Apply migrations to Neon E2E branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm prisma:deploy

      - name: Run Playwright suite
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete Neon E2E branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
